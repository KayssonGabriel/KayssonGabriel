name: Atualizar perfil público

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions: {}

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Validar o gerador
        run: python3 -m unittest discover -s tests -v
      - name: Atualizar os dados públicos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m profile_readme --refresh
          python3 -m profile_readme --check
      - name: Publicar os arquivos atualizados
        shell: bash
        run: |
          git add -- README.md assets data/public.json
          if git diff --cached --quiet; then
            echo "Dados e cartões já estão atualizados."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Atualizar dados públicos do perfil'
          git push origin "HEAD:$GITHUB_REF"
