name: Validar perfil

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Executar testes e verificar os arquivos gerados
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m profile_readme --check
